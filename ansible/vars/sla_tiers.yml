# =============================================================================
# FSI Kafka Platform -- SLA Tier Governance Constants
# =============================================================================
# Source of truth: modules/topic/main.tf lines 44-82
# WARNING: These values MUST stay in sync with Terraform.
# CI validates parity -- see tests/ansible/test_governance_parity.py
# =============================================================================

sla_tiers:
  critical:
    compatibility: FULL_TRANSITIVE
    partitions: 12
    retention_ms: 604800000
    min_insync_replicas: 2
  standard:
    compatibility: BACKWARD_TRANSITIVE
    partitions: 6
    retention_ms: 259200000
    min_insync_replicas: 2
  best-effort:
    compatibility: BACKWARD
    partitions: 3
    retention_ms: 86400000
    min_insync_replicas: 1
  compliance:
    compatibility: FULL_TRANSITIVE
    partitions: 12
    retention_ms: -1
    min_insync_replicas: 2

sla_tier_default: standard

sla_tier_names:
  - critical
  - standard
  - best-effort
  - compliance

# =============================================================================
# Mirror Lag Thresholds -- used by cp_dr_mm2 role for pre-failover warnings
# =============================================================================
# Maps SLA tiers to acceptable mirror replication lag in seconds.
# Derived from fsi-dr.sh _tier_warn_threshold / _tier_alert_threshold functions.
# NOTE: These are DR-specific thresholds, NOT parity-tested with Terraform
# (Terraform does not manage MM2 mirror lag -- CP/CFK only).
# =============================================================================

sla_tier_mirror_lag:
  critical:
    warn_seconds: 30
    alert_seconds: 60
  standard:
    warn_seconds: 300
    alert_seconds: 900
  best-effort:
    warn_seconds: 3600
    alert_seconds: 14400
  compliance:
    warn_seconds: 10
    alert_seconds: 30
