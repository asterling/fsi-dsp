# =============================================================================
# DR (Passive) Region Inventory
# =============================================================================
# Mirrors production configuration. Used during failover/failback operations.
# See scripts/mirror-failover.sh for DR orchestration.
#
# Usage:
#   ansible-playbook -i inventories/dr/hosts.yml playbooks/deploy-cp.yml --ask-vault-pass
#
# Replace <IP_ADDRESS> and <AVAILABILITY_ZONE> placeholders before use.
# =============================================================================

all:
  vars:
    ansible_connection: ssh
    ansible_user: confluent
    ansible_become: true
    confluent_server_enabled: true
    confluent_package_version: "7.7.0"

  children:
    # -------------------------------------------------------------------------
    # Kafka Brokers (3 nodes, multi-rack)
    # -------------------------------------------------------------------------
    kafka_broker:
      hosts:
        kafka-dr-1:
          ansible_host: <IP_ADDRESS>
          kafka_broker_custom_properties:
            broker.id: 1
            broker.rack: <AVAILABILITY_ZONE>
        kafka-dr-2:
          ansible_host: <IP_ADDRESS>
          kafka_broker_custom_properties:
            broker.id: 2
            broker.rack: <AVAILABILITY_ZONE>
        kafka-dr-3:
          ansible_host: <IP_ADDRESS>
          kafka_broker_custom_properties:
            broker.id: 3
            broker.rack: <AVAILABILITY_ZONE>

    # -------------------------------------------------------------------------
    # Schema Registry (2 nodes, HA)
    # -------------------------------------------------------------------------
    schema_registry:
      hosts:
        sr-dr-1:
          ansible_host: <IP_ADDRESS>
        sr-dr-2:
          ansible_host: <IP_ADDRESS>

    # -------------------------------------------------------------------------
    # Kafka Connect (2 nodes, distributed mode)
    # -------------------------------------------------------------------------
    kafka_connect:
      hosts:
        connect-dr-1:
          ansible_host: <IP_ADDRESS>
        connect-dr-2:
          ansible_host: <IP_ADDRESS>

    # -------------------------------------------------------------------------
    # Standalone Flink
    # -------------------------------------------------------------------------
    flink_jobmanager:
      hosts:
        flink-jm-dr-1:
          ansible_host: <IP_ADDRESS>

    flink_taskmanager:
      hosts:
        flink-tm-dr-1:
          ansible_host: <IP_ADDRESS>
        flink-tm-dr-2:
          ansible_host: <IP_ADDRESS>
