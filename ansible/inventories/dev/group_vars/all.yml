# =============================================================================
# Dev Environment -- Common Variables
# =============================================================================
# Minimal security for fast iteration. TLS and RBAC are disabled.
# For Vault-based secrets management, see staging and prod group_vars.
# =============================================================================

# ---------------------------------------------------------------------------
# CP version and base settings
# ---------------------------------------------------------------------------
confluent_server_enabled: true
confluent_package_version: "7.7.0"

# ---------------------------------------------------------------------------
# Security -- disabled for dev
# ---------------------------------------------------------------------------
ssl_enabled: false
ssl_mutual_auth_enabled: false
rbac_enabled: false

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
jmxexporter_enabled: true

# ---------------------------------------------------------------------------
# FIPS -- disabled for dev
# ---------------------------------------------------------------------------
fips_enabled: false
