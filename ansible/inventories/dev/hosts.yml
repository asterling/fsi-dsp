# =============================================================================
# Development Environment Inventory
# =============================================================================
# Single-node topology for local/dev testing of cp-ansible roles.
#
# Usage:
#   ansible-playbook -i inventories/dev/hosts.yml playbooks/deploy-cp.yml
#
# Replace <IP_ADDRESS> placeholders with actual host IPs or DNS names.
# =============================================================================

all:
  vars:
    ansible_connection: ssh
    ansible_user: confluent
    ansible_become: true
    confluent_server_enabled: true
    confluent_package_version: "7.7.0"

  children:
    # -------------------------------------------------------------------------
    # Kafka Brokers (1 node -- dev only)
    # -------------------------------------------------------------------------
    kafka_broker:
      hosts:
        kafka-dev-1:
          ansible_host: <IP_ADDRESS>
          kafka_broker_custom_properties:
            broker.id: 1

    # -------------------------------------------------------------------------
    # Schema Registry (1 node)
    # -------------------------------------------------------------------------
    schema_registry:
      hosts:
        sr-dev-1:
          ansible_host: <IP_ADDRESS>

    # -------------------------------------------------------------------------
    # Kafka Connect (1 node)
    # -------------------------------------------------------------------------
    kafka_connect:
      hosts:
        connect-dev-1:
          ansible_host: <IP_ADDRESS>

    # -------------------------------------------------------------------------
    # Standalone Flink
    # -------------------------------------------------------------------------
    flink_jobmanager:
      hosts:
        flink-jm-dev-1:
          ansible_host: <IP_ADDRESS>

    flink_taskmanager:
      hosts:
        flink-tm-dev-1:
          ansible_host: <IP_ADDRESS>
