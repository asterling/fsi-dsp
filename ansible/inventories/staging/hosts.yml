# =============================================================================
# Staging Environment Inventory -- production-like topology
# =============================================================================
# Multi-node topology that mirrors production for pre-release validation.
# 3 brokers (multi-rack), 2 SR nodes, 2 Connect workers, Flink cluster.
#
# Usage:
#   ansible-playbook -i inventories/staging/hosts.yml playbooks/deploy-cp.yml
#
# Replace <IP_ADDRESS> and <AVAILABILITY_ZONE> placeholders before use.
# =============================================================================

all:
  vars:
    ansible_connection: ssh
    ansible_user: confluent
    ansible_become: true
    confluent_server_enabled: true
    confluent_package_version: "7.7.0"

  children:
    # -------------------------------------------------------------------------
    # Kafka Brokers (3 nodes, multi-rack)
    # -------------------------------------------------------------------------
    kafka_broker:
      hosts:
        kafka-staging-1:
          ansible_host: <IP_ADDRESS>
          kafka_broker_custom_properties:
            broker.id: 1
            broker.rack: <AVAILABILITY_ZONE>
        kafka-staging-2:
          ansible_host: <IP_ADDRESS>
          kafka_broker_custom_properties:
            broker.id: 2
            broker.rack: <AVAILABILITY_ZONE>
        kafka-staging-3:
          ansible_host: <IP_ADDRESS>
          kafka_broker_custom_properties:
            broker.id: 3
            broker.rack: <AVAILABILITY_ZONE>

    # -------------------------------------------------------------------------
    # Schema Registry (2 nodes, HA)
    # -------------------------------------------------------------------------
    schema_registry:
      hosts:
        sr-staging-1:
          ansible_host: <IP_ADDRESS>
        sr-staging-2:
          ansible_host: <IP_ADDRESS>

    # -------------------------------------------------------------------------
    # Kafka Connect (2 nodes, distributed mode)
    # -------------------------------------------------------------------------
    kafka_connect:
      hosts:
        connect-staging-1:
          ansible_host: <IP_ADDRESS>
        connect-staging-2:
          ansible_host: <IP_ADDRESS>

    # -------------------------------------------------------------------------
    # Standalone Flink
    # -------------------------------------------------------------------------
    flink_jobmanager:
      hosts:
        flink-jm-staging-1:
          ansible_host: <IP_ADDRESS>

    flink_taskmanager:
      hosts:
        flink-tm-staging-1:
          ansible_host: <IP_ADDRESS>
        flink-tm-staging-2:
          ansible_host: <IP_ADDRESS>
