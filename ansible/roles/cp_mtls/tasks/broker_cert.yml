---
# =============================================================================
# cp_mtls -- Broker cert provisioning (runs on each kafka_broker host)
# =============================================================================
# Flow:
#   1. Broker: generate private key LOCALLY (never leaves the broker)
#   2. Broker: generate CSR with SANs + serverAuth/clientAuth EKU
#   3. Controller: fetch CSR from broker
#   4. CA host: sign CSR with CA key
#   5. Controller: fetch signed cert from CA host
#   6. Broker: receive signed cert + CA cert
#   7. Broker: assemble PKCS12 keystore LOCALLY
#
# Private keys never cross the wire. Only CSRs and certs do.
# =============================================================================

- name: Ensure SSL directory on broker
  ansible.builtin.file:
    path: "{{ cp_mtls_ssl_dir }}"
    state: directory
    owner: "{{ cp_mtls_ssl_owner }}"
    group: "{{ cp_mtls_ssl_group }}"
    mode: '0750'

- name: Generate broker private key on broker
  community.crypto.openssl_privatekey:
    path: "{{ cp_mtls_ssl_dir }}/{{ inventory_hostname_short }}.key.pem"
    size: "{{ cp_mtls_cert_key_size }}"
    type: RSA
    owner: "{{ cp_mtls_ssl_owner }}"
    group: "{{ cp_mtls_ssl_group }}"
    mode: '0400'

- name: Generate broker CSR on broker (with SANs + serverAuth,clientAuth EKU)
  community.crypto.openssl_csr:
    path: "{{ cp_mtls_ssl_dir }}/{{ inventory_hostname_short }}.csr"
    privatekey_path: "{{ cp_mtls_ssl_dir }}/{{ inventory_hostname_short }}.key.pem"
    common_name: "{{ inventory_hostname }}"
    organization_name: "{{ cp_mtls_ca_org }}"
    organizational_unit_name: "{{ cp_mtls_ca_ou }}"
    country_name: "{{ cp_mtls_ca_country }}"
    state_or_province_name: "{{ cp_mtls_ca_state }}"
    locality_name: "{{ cp_mtls_ca_locality }}"
    subject_alt_name: "{{ _broker_san_list }}"
    extended_key_usage:
      - serverAuth
      - clientAuth
    extended_key_usage_critical: false
    key_usage:
      - digitalSignature
      - keyEncipherment
    key_usage_critical: true
    digest: "{{ cp_mtls_cert_digest }}"
    owner: "{{ cp_mtls_ssl_owner }}"
    group: "{{ cp_mtls_ssl_group }}"
    mode: '0444'
  vars:
    _broker_san_list: >-
      {{ ['DNS:' ~ inventory_hostname,
          'DNS:' ~ inventory_hostname_short,
          'IP:' ~ broker_ip]
         + (broker_extra_sans | default([])) }}

- name: Ensure controller staging dir exists for CSRs
  ansible.builtin.file:
    path: "{{ cp_mtls_ctrl_csr_dir }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  run_once: true
  become: false

- name: Fetch CSR from broker to controller
  ansible.builtin.fetch:
    src: "{{ cp_mtls_ssl_dir }}/{{ inventory_hostname_short }}.csr"
    dest: "{{ cp_mtls_ctrl_csr_dir }}/{{ inventory_hostname_short }}.csr"
    flat: true

- name: Ship CSR to CA host
  ansible.builtin.copy:
    src: "{{ cp_mtls_ctrl_csr_dir }}/{{ inventory_hostname_short }}.csr"
    dest: "{{ cp_mtls_ca_dir }}/signed/{{ inventory_hostname_short }}.csr"
    owner: root
    group: root
    mode: '0400'
  delegate_to: "{{ groups['cert_authority'][0] }}"

- name: Sign broker CSR on CA host (ownca provider)
  community.crypto.x509_certificate:
    path: "{{ cp_mtls_ca_dir }}/signed/{{ inventory_hostname_short }}-cert.pem"
    csr_path: "{{ cp_mtls_ca_dir }}/signed/{{ inventory_hostname_short }}.csr"
    ownca_path: "{{ cp_mtls_ca_dir }}/ca-cert.pem"
    ownca_privatekey_path: "{{ cp_mtls_ca_dir }}/ca-key.pem"
    ownca_privatekey_passphrase: "{{ cp_mtls_ca_passphrase }}"
    ownca_not_after: "+{{ cp_mtls_cert_validity_days }}d"
    ownca_digest: "{{ cp_mtls_cert_digest }}"
    provider: ownca
    owner: root
    group: root
    mode: '0444'
  delegate_to: "{{ groups['cert_authority'][0] }}"

- name: Ensure controller staging dir exists for signed certs
  ansible.builtin.file:
    path: "{{ cp_mtls_ctrl_signed_dir }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  run_once: true
  become: false

- name: Fetch signed broker cert from CA host to controller
  ansible.builtin.fetch:
    src: "{{ cp_mtls_ca_dir }}/signed/{{ inventory_hostname_short }}-cert.pem"
    dest: "{{ cp_mtls_ctrl_signed_dir }}/{{ inventory_hostname_short }}-cert.pem"
    flat: true
  delegate_to: "{{ groups['cert_authority'][0] }}"

- name: Ship signed broker cert to broker
  ansible.builtin.copy:
    src: "{{ cp_mtls_ctrl_signed_dir }}/{{ inventory_hostname_short }}-cert.pem"
    dest: "{{ cp_mtls_ssl_dir }}/{{ inventory_hostname_short }}-cert.pem"
    owner: "{{ cp_mtls_ssl_owner }}"
    group: "{{ cp_mtls_ssl_group }}"
    mode: '0444'

- name: Ship CA cert to broker
  ansible.builtin.copy:
    src: "{{ cp_mtls_ctrl_ca_cert }}"
    dest: "{{ cp_mtls_ssl_dir }}/ca-cert.pem"
    owner: "{{ cp_mtls_ssl_owner }}"
    group: "{{ cp_mtls_ssl_group }}"
    mode: '0444'

- name: Assemble broker PKCS12 keystore on broker
  community.crypto.openssl_pkcs12:
    path: "{{ cp_mtls_ssl_dir }}/{{ inventory_hostname_short }}.keystore.p12"
    friendly_name: "{{ inventory_hostname_short }}"
    privatekey_path: "{{ cp_mtls_ssl_dir }}/{{ inventory_hostname_short }}.key.pem"
    certificate_path: "{{ cp_mtls_ssl_dir }}/{{ inventory_hostname_short }}-cert.pem"
    other_certificates:
      - "{{ cp_mtls_ssl_dir }}/ca-cert.pem"
    passphrase: "{{ cp_mtls_keystore_password }}"
    state: present
    owner: "{{ cp_mtls_ssl_owner }}"
    group: "{{ cp_mtls_ssl_group }}"
    mode: '0400'

- name: Verify broker cert chain validates against CA
  ansible.builtin.command:
    cmd: >
      openssl verify
      -CAfile {{ cp_mtls_ssl_dir }}/ca-cert.pem
      {{ cp_mtls_ssl_dir }}/{{ inventory_hostname_short }}-cert.pem
  changed_when: false
  register: _mtls_verify_chain

- name: Report chain validation
  ansible.builtin.debug:
    var: _mtls_verify_chain.stdout

- name: Increment broker cert counter
  ansible.builtin.set_fact:
    _mtls_broker_certs: "{{ _mtls_broker_certs | int + 1 }}"
