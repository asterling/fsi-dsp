---
galaxy_info:
  role_name: cp_cockroachdb
  author: FSI Kafka Platform C4E
  description: >-
    Deploy and validate CockroachDB JDBC sink connectors on CP / CFK /
    LinuxONE Connect clusters. CRDB is Postgres-wire-compatible -- the
    Postgres JDBC driver pointed at port 26257 is the canonical sink path.
    CRDB sources use native CREATE CHANGEFEED SQL (no Connect involved);
    see reference/cockroachdb/changefeed-examples.sql.
  license: Internal
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions: ["8", "9"]

dependencies:
  - role: cp_connect
