---
# =============================================================================
# cp_databricks_sink -- Health validation pass-through
# =============================================================================
# Health validation is delegated to cp_connect with cp_connectors substituted
# for cp_databricks_connectors. This file exists for symmetry with cp_connect's
# task structure; main.yml routes to cp_connect's validate.yml automatically.
# =============================================================================

- name: Delegate validation to cp_connect
  ansible.builtin.include_role:
    name: cp_connect
    tasks_from: validate.yml
  vars:
    cp_connectors: "{{ cp_databricks_connectors | default([]) }}"
