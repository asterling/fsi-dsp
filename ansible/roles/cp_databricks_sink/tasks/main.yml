---
# =============================================================================
# cp_databricks_sink role -- Entry point
# =============================================================================
# Thin wrapper around cp_connect: substitutes cp_databricks_connectors for
# cp_connectors so the same idempotent PUT-based deploy + validate path
# handles Databricks Delta Lake sinks specifically. Provides connector-class
# validation and result reporting tagged with sink_type.
# =============================================================================

- name: Initialize databricks sink result counters
  ansible.builtin.set_fact:
    _databricks_created: 0
    _databricks_updated: 0
    _databricks_failed: 0
    _databricks_healthy: 0
    _databricks_unhealthy: 0

- name: Assert all configured connectors use the Databricks Delta sink class
  ansible.builtin.assert:
    that:
      - item.config['connector.class'] == 'io.confluent.connect.databricks.DatabricksDeltaLakeSinkConnector'
    fail_msg: >-
      Connector {{ item.name }} has connector.class
      '{{ item.config['connector.class'] }}'.
      cp_databricks_sink only handles
      io.confluent.connect.databricks.DatabricksDeltaLakeSinkConnector.
  loop: "{{ cp_databricks_connectors | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate DLQ topic naming convention
  ansible.builtin.assert:
    that:
      - item.config['errors.deadletterqueue.topic.name'] is defined
      - item.config['errors.deadletterqueue.topic.name'] is match('^lakehouse\\.dlq\\..+')
    fail_msg: >-
      Connector {{ item.name }} DLQ must follow naming convention
      lakehouse.dlq.<sink-name>. ADR-011 requires per-sink DLQ topics.
  loop: "{{ cp_databricks_connectors | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy databricks sinks via cp_connect role
  ansible.builtin.include_role:
    name: cp_connect
  vars:
    cp_connectors: "{{ cp_databricks_connectors | default([]) }}"

- name: Capture per-sink-type results from cp_connect
  ansible.builtin.set_fact:
    _databricks_created: "{{ cp_connect_results.created | default(0) }}"
    _databricks_updated: "{{ cp_connect_results.updated | default(0) }}"
    _databricks_failed: "{{ cp_connect_results.failed | default(0) }}"
    _databricks_healthy: "{{ cp_connect_results.healthy | default(0) }}"
    _databricks_unhealthy: "{{ cp_connect_results.unhealthy | default(0) }}"
  when: cp_connect_results is defined

- name: Report Databricks sink results
  ansible.builtin.debug:
    msg: >-
      cp_databricks_sink results:
      created={{ _databricks_created }},
      updated={{ _databricks_updated }},
      failed={{ _databricks_failed }},
      healthy={{ _databricks_healthy }},
      unhealthy={{ _databricks_unhealthy }}

- name: Set cp_databricks_sink_results output variable
  ansible.builtin.set_fact:
    cp_databricks_sink_results:
      created: "{{ _databricks_created | int }}"
      updated: "{{ _databricks_updated | int }}"
      failed: "{{ _databricks_failed | int }}"
      healthy: "{{ _databricks_healthy | int }}"
      unhealthy: "{{ _databricks_unhealthy | int }}"
