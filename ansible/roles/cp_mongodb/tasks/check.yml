---
# =============================================================================
# cp_mongodb -- Check mode pass-through (both directions)
# =============================================================================
- name: Delegate source check mode to cp_connect
  ansible.builtin.include_role:
    name: cp_connect
    tasks_from: check.yml
  vars:
    cp_connectors: "{{ cp_mongodb_source_connectors | default([]) }}"
  when: (cp_mongodb_source_connectors | default([])) | length > 0

- name: Delegate sink check mode to cp_connect
  ansible.builtin.include_role:
    name: cp_connect
    tasks_from: check.yml
  vars:
    cp_connectors: "{{ cp_mongodb_sink_connectors | default([]) }}"
  when: (cp_mongodb_sink_connectors | default([])) | length > 0
