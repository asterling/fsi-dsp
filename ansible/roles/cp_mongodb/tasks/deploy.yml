---
# =============================================================================
# cp_mongodb -- Deploy pass-through (both directions)
# =============================================================================
- name: Delegate source deploy to cp_connect
  ansible.builtin.include_role:
    name: cp_connect
    tasks_from: deploy.yml
  vars:
    cp_connectors: "{{ cp_mongodb_source_connectors | default([]) }}"
  when: (cp_mongodb_source_connectors | default([])) | length > 0

- name: Delegate sink deploy to cp_connect
  ansible.builtin.include_role:
    name: cp_connect
    tasks_from: deploy.yml
  vars:
    cp_connectors: "{{ cp_mongodb_sink_connectors | default([]) }}"
  when: (cp_mongodb_sink_connectors | default([])) | length > 0
