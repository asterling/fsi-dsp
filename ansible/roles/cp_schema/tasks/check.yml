# =============================================================================
# cp_schema role -- Check-mode report per schema
# =============================================================================
# Gathers current state from SR without mutations, reports what WOULD change.
# All uri tasks use check_mode: false to execute GET requests in check mode.
# =============================================================================
---
# Build auth headers (same as compatibility.yml)
- name: "Set auth headers for check: {{ schema_item.subject }}"
  ansible.builtin.set_fact:
    _sr_check_headers:
      Content-Type: "application/vnd.schemaregistry.v1+json"
      Authorization: "Bearer {{ cp_sr_token }}"
  when: cp_sr_token | length > 0
  no_log: true
  check_mode: false

- name: "Set basic auth for check: {{ schema_item.subject }}"
  ansible.builtin.set_fact:
    _sr_check_use_basic_auth: "{{ cp_sr_token | length == 0 }}"
    _sr_check_headers:
      Content-Type: "application/vnd.schemaregistry.v1+json"
  when: cp_sr_token | length == 0
  no_log: true
  check_mode: false

# Get current subject version
- name: "Check current version: {{ schema_item.subject }}"
  ansible.builtin.uri:
    url: "{{ cp_sr_url }}/subjects/{{ schema_item.subject }}/versions/latest"
    method: GET
    headers: "{{ _sr_check_headers }}"
    url_username: "{{ cp_sr_user if _sr_check_use_basic_auth | default(false) else omit }}"
    url_password: "{{ cp_sr_password if _sr_check_use_basic_auth | default(false) else omit }}"
    force_basic_auth: "{{ _sr_check_use_basic_auth | default(false) }}"
    status_code: [200, 404]
    timeout: 30
  register: _check_current
  check_mode: false

# Check compatibility if subject exists
- name: "Check compatibility (dry-run): {{ schema_item.subject }}"
  ansible.builtin.uri:
    url: "{{ cp_sr_url }}/compatibility/subjects/{{ schema_item.subject }}/versions/latest?verbose=true"
    method: POST
    headers: "{{ _sr_check_headers }}"
    body_format: json
    body:
      schema: "{{ schema_item.schema_content | to_json }}"
      schemaType: AVRO
    url_username: "{{ cp_sr_user if _sr_check_use_basic_auth | default(false) else omit }}"
    url_password: "{{ cp_sr_password if _sr_check_use_basic_auth | default(false) else omit }}"
    force_basic_auth: "{{ _sr_check_use_basic_auth | default(false) }}"
    status_code: [200]
    timeout: 30
  register: _check_compat
  when: _check_current.status == 200
  check_mode: false

# Report: WOULD REGISTER (new), WOULD UPDATE (compatible), WOULD FAIL (incompatible)
- name: "Report: WOULD REGISTER new subject {{ schema_item.subject }}"
  ansible.builtin.debug:
    msg: "WOULD REGISTER: {{ schema_item.subject }} (new subject, no existing versions)"
  when: _check_current.status == 404
  changed_when: true

- name: "Report: WOULD UPDATE subject {{ schema_item.subject }}"
  ansible.builtin.debug:
    msg: "WOULD UPDATE: {{ schema_item.subject }} (compatible schema change)"
  when:
    - _check_current.status == 200
    - _check_compat.json.is_compatible | default(true)
  changed_when: true

- name: "Report: WOULD FAIL subject {{ schema_item.subject }}"
  ansible.builtin.debug:
    msg: >-
      WOULD FAIL: {{ schema_item.subject }} (incompatible schema change).
      Messages: {{ _check_compat.json.messages | default([]) | join(', ') }}
  when:
    - _check_current.status == 200
    - not (_check_compat.json.is_compatible | default(true))
  changed_when: false
