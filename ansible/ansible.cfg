# =============================================================================
# FSI Kafka Platform -- Project-scoped Ansible Configuration
# =============================================================================
# This configuration applies to all playbooks executed from the ansible/
# directory. It sets the collections path, custom filter plugins directory,
# default inventory, and SSH connection defaults.
#
# NOTE: cp-ansible 7.7.x may emit a deprecation warning with ansible-core 2.15+
# regarding the 'include' module. This is cosmetic and safe to ignore --
# cp-ansible roles function correctly.
# =============================================================================

[defaults]
collections_path = ./collections:~/.ansible/collections
filter_plugins = ./filter_plugins
inventory = ./inventories/dev
deprecation_warnings = False
retry_files_enabled = False
host_key_checking = False
timeout = 30

[inventory]
enable_plugins = yaml, ini

[privilege_escalation]
become = true
become_method = sudo
