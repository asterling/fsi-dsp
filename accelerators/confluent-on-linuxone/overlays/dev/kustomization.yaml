apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# =============================================================================
# overlays/dev/kustomization.yaml — development overlay
# =============================================================================
# Same base + 5 components as prod, with relaxed environment-specific settings:
#   - Audit retention: 30 days (vs 7 years in prod) — reduce dev storage cost
#   - Schema compatibility: BACKWARD (vs FULL_TRANSITIVE in prod) — allow faster iteration
#   - Flink: parallelism 1, 60s checkpoint interval (reduced resource use)
#   - Flink output retention: 30 days
#
# All 5 hardening layers are applied in dev too — this ensures dev is functionally
# identical to prod (no "works in dev" RBAC surprises in prod).
# 05-flink is appended LAST — depends on layer 01 MDS + layer 02 confluent-ca-issuer.
# =============================================================================

resources:
  - ../../base

components:
  - ../../layers/01-rbac
  - ../../layers/02-tls
  - ../../layers/03-schema-governance
  - ../../layers/04-audit
  - ../../layers/05-flink
  # Layer 06: Lakehouse sinks. Commented out in dev to avoid Databricks/
  # Snowflake credential coupling; enable when the dev cluster has a
  # lakehouse-creds Secret reconciled by Vault-Agent.
  # - ../../layers/06-lakehouse-sinks

namespace: confluent

patches:
  # Audit topic: 30-day retention for dev (vs 7y in prod)
  - patch: |-
      - op: replace
        path: /spec/configs/retention.ms
        value: "2592000000"
    target:
      kind: KafkaTopic
      name: confluent-audit-log-events

  # Schema Registry: BACKWARD compat for dev (faster iteration; still enforces no breaks)
  - patch: |-
      - op: replace
        path: /spec/configOverrides/server/0
        value: "schema.compatibility.level=backward"
    target:
      kind: SchemaRegistry
      name: schemaregistry

  # Schema Registry: relaxed subject naming for dev (allow test- prefix +
  # 1+ dot-separated segments — matches prod's multi-segment allowance).
  - patch: |-
      - op: add
        path: /spec/configOverrides/server/-
        value: "schema.registry.subject.name.pattern=^(test-|[a-z][a-z0-9-]*(\\.[a-z][a-z0-9-]*)+)-(key|value)$"
    target:
      kind: SchemaRegistry
      name: schemaregistry

  # Reduce replica counts for dev (3 replicas is overkill on a dev cluster)
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Kafka
      name: kafka
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Connect
      name: connect

  # Flink output topics: 30-day retention for dev (vs 7y in prod)
  - patch: |-
      - op: replace
        path: /spec/configs/retention.ms
        value: "2592000000"
    target:
      kind: KafkaTopic
      name: flink-output-txn-volume-1m
  - patch: |-
      - op: replace
        path: /spec/configs/retention.ms
        value: "2592000000"
    target:
      kind: KafkaTopic
      name: flink-output-enriched-transaction

  # FlinkApplication: dev sizing — parallelism 1, 60s checkpoint interval
  # Reduces resource use on a dev cluster (vs prod: parallelism 2, 30s)
  - patch: |-
      - op: replace
        path: /spec/job/parallelism
        value: 1
      - op: replace
        path: /spec/flinkConfiguration/execution.checkpointing.interval
        value: "60000"
    target:
      kind: FlinkApplication
      name: fsi-txn-volume-tumbling-window
  - patch: |-
      - op: replace
        path: /spec/job/parallelism
        value: 1
      - op: replace
        path: /spec/flinkConfiguration/execution.checkpointing.interval
        value: "60000"
    target:
      kind: FlinkApplication
      name: fsi-account-txn-enrichment

commonLabels:
  app.kubernetes.io/managed-by: "kustomize"
  environment: "development"
  goodlabs.io/accelerator: "confluent-on-linuxone"
