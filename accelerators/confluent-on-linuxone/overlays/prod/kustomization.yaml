apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# =============================================================================
# overlays/prod/kustomization.yaml — production overlay
# =============================================================================
# The ONLY buildable Kustomization artifact for the prod environment.
# Composes base + all 5 FSI hardening components in dependency order:
#   01-rbac (must apply before 04-audit — ConfluentServerAuthorizer first)
#   02-tls  (must apply before 03/04/05 — TLS secrets + confluent-ca-issuer ClusterIssuer)
#   03-schema-governance
#   04-audit
#   05-flink (appended LAST — depends on layer 01 MDS + layer 02 cert ClusterIssuer
#             and broker mTLS listener)
# =============================================================================

# Upstream base: Mondics's CP 8.2.0 CFK manifests (populated by fetch-upstream.sh)
resources:
  - ../../base

# FSI hardening layers as Kustomize Components
# Components apply in listed order — this encodes layer dependencies.
components:
  - ../../layers/01-rbac
  - ../../layers/02-tls
  - ../../layers/03-schema-governance
  - ../../layers/04-audit
  - ../../layers/05-flink

# Namespace for all resources
namespace: confluent

# Production-specific variable substitutions
# These are set as ConfigMap/patch values consumed by the layer patches.
vars: []

# Production-specific patches — override overlay-variable defaults from layers
patches:
  # Audit topic: 7-year retention for OFAC/AML/SOX compliance
  - patch: |-
      - op: replace
        path: /spec/configs/retention.ms
        value: "220752000000"
    target:
      kind: KafkaTopic
      name: confluent-audit-log-events

  # Schema Registry: subject naming pattern for production.
  # Permits 1+ dot-separated segments — e.g. payments.transaction-value (2
  # segments) AND corebanking.transactions.v1.account-transaction-value
  # (4 segments, as used by reference/flink-sql/ and layer 05 sinks).
  # Each segment is lowercase, starts with a letter; final -(key|value) is required.
  - patch: |-
      - op: add
        path: /spec/configOverrides/server/-
        value: "schema.registry.subject.name.pattern=^[a-z][a-z0-9-]*(\\.[a-z][a-z0-9-]*)+-(key|value)$"
    target:
      kind: SchemaRegistry
      name: schemaregistry

  # Flink output topics: 7-year retention for OFAC/AML/SOX compliance
  # Windowed aggregation and enrichment outputs are regulatory evidence.
  - patch: |-
      - op: replace
        path: /spec/configs/retention.ms
        value: "220752000000"
    target:
      kind: KafkaTopic
      name: flink-output-txn-volume-1m
  - patch: |-
      - op: replace
        path: /spec/configs/retention.ms
        value: "220752000000"
    target:
      kind: KafkaTopic
      name: flink-output-enriched-transaction

  # FlinkApplication: production sizing — EXACTLY_ONCE semantics, 30s checkpoint interval, parallelism 2
  # EXACTLY_ONCE required for regulatory reporting (no duplicate events in OFAC/AML outputs).
  - patch: |-
      - op: replace
        path: /spec/job/parallelism
        value: 2
      - op: replace
        path: /spec/flinkConfiguration/execution.checkpointing.interval
        value: "30000"
    target:
      kind: FlinkApplication
      name: fsi-txn-volume-tumbling-window
  - patch: |-
      - op: replace
        path: /spec/job/parallelism
        value: 2
      - op: replace
        path: /spec/flinkConfiguration/execution.checkpointing.interval
        value: "30000"
    target:
      kind: FlinkApplication
      name: fsi-account-txn-enrichment

commonLabels:
  app.kubernetes.io/managed-by: "kustomize"
  environment: "production"
  goodlabs.io/accelerator: "confluent-on-linuxone"
