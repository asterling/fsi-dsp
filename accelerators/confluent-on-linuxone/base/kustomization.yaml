apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# =============================================================================
# base/kustomization.yaml — references Mondics's upstream manifests
# =============================================================================
# upstream/ is populated by fetch-upstream.sh (gitignored, never committed).
# Run `bash base/fetch-upstream.sh` before `kustomize build`.
#
# This base is the generic demo: CP 8.2.0, CFK 3.2.x, KRaft, autoGeneratedCerts,
# no RBAC, Connect commented out. The FSI layers in ../layers/ add production controls.
# =============================================================================

resources:
  # Core Confluent Platform components (Kafka, SR, Connect, C3, KafkaRestClass).
  # Filename matches Mondics's repo exactly — do not rename.
  - ./upstream/confluent-platform-c3++.yaml
  # Cluster Linking for x86-to-LinuxONE migration — used by MIGRATION.md
  - ./upstream/clusterlink.yaml
  # KafkaRestClass CR — required for REST Proxy and C3 REST API
  - ./upstream/kafkarestclass.yaml
  # Sample producer application data — reference workload for validation
  - ./upstream/producer-app-data.yaml
