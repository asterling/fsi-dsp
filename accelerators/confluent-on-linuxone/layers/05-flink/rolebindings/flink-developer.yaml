---
# =============================================================================
# rolebindings/flink-developer.yaml — Flink developer RBAC binding
# =============================================================================
# Grants the Flink developer group permission to submit, cancel, and monitor
# FlinkApplication CRs via CMF REST. This binding is bound to an LDAP group,
# never to individuals — the IdP is the identity boundary (same FSI convention
# as all layer 01-rbac bindings).
#
# FSI rationale: Segregation of duties requires that the identity that deploys
# Flink jobs is auditable via the IdP group membership, not ad-hoc individual
# credentials. Binding to an LDAP group ensures that:
#   1. Access is revocable by removing the user from the IdP group (no per-user
#      ConfluentRolebinding deletion required).
#   2. Group membership changes are captured in the IdP audit trail, satisfying
#      SOX/FFIEC access-change logging requirements.
#
# The FlinkDeveloper role grants:
#   - Submit / cancel / savepoint FlinkApplication CRs in the environment
#   - Manage Flink artifacts and workspaces
#   - View FlinkApplication status and logs via CMF REST
# It does NOT grant topic-level produce/consume — that is scoped to the Flink
# job's service account (see flink-job-runtime.yaml).
#
# Role catalog reference (CMF / Confluent for Apache Flink RBAC):
#   - FlinkDeveloper    — submit/run statements + manage own workspaces (this binding)
#   - FlinkAdmin        — full Flink admin in env (manage compute pools)
#   - Operator          — metadata-only access to tables/databases/catalogs
# `FlinkEnvironmentAdmin` is NOT in the published role catalog — use FlinkDeveloper.
#
# Verify resourceType against the live CMF 2.3.x CRD at deploy time:
#   `confluent iam rbac role list` (catalog) and `oc explain confluentrolebinding.spec.resourcePatterns`
# CMF may identify Flink environments under a different resourceType string;
# the FlinkEnvironment CRD kind is the most likely candidate.
# =============================================================================
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: flink-developer
  namespace: confluent
  labels:
    goodlabs.io/layer: "05-flink"
    goodlabs.io/accelerator: "confluent-on-linuxone"
spec:
  principal:
    # Bind to an LDAP group — never to individuals.
    # Replace <PLACEHOLDER_FLINK_DEVELOPER_LDAP_GROUP> with the actual group DN
    # or short name as configured in MDS LDAP settings (layer 01).
    type: group
    name: <PLACEHOLDER_FLINK_DEVELOPER_LDAP_GROUP>
  # FlinkDeveloper: manage Flink statements + own workspaces via CMF REST.
  # Scoped to the fsi-flink-env FlinkEnvironment (not cluster-wide admin).
  role: FlinkDeveloper
  resourcePatterns:
    - resourceType: FlinkEnvironment
      name: fsi-flink-env
      patternType: LITERAL
