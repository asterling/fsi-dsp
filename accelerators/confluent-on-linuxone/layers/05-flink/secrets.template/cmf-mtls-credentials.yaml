---
# =============================================================================
# secrets.template/cmf-mtls-credentials.yaml — CMF mTLS Secret template
# =============================================================================
# Template for the K8s Secret used by CMFRestClass for the CFK→CMF mTLS channel.
# Populate from the cert-manager-issued cmf-tls Certificate (tls/certificate-crs.yaml)
# or generate manually using cfssl + the confluent-ca-issuer CA PEMs.
#
# DO NOT commit real values — replace every <PLACEHOLDER> before applying.
# This file is intentionally excluded from kustomization.yaml resources:.
#
# Usage:
#   cp layers/05-flink/secrets.template/cmf-mtls-credentials.yaml /tmp/cmf-mtls-credentials.yaml
#   # Replace all <PLACEHOLDER> values with real base64-encoded PEMs
#   oc apply -f /tmp/cmf-mtls-credentials.yaml -n confluent
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cmf-mtls-credentials
  namespace: confluent
type: kubernetes.io/tls
data:
  # Client certificate (PEM, base64-encoded) issued by confluent-ca-issuer
  tls.crt: <PLACEHOLDER_CMF_CLIENT_CERT_BASE64>
  # Client private key (PEM, base64-encoded) — never committed to version control
  tls.key: <PLACEHOLDER_CMF_CLIENT_KEY_BASE64>
  # CA certificate (PEM, base64-encoded) — same CA as layer 02 (confluent-ca-issuer)
  ca.crt: <PLACEHOLDER_CONFLUENT_CA_CERT_BASE64>
