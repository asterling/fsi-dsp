---
# =============================================================================
# secrets.template/flink-jks-password.yaml — JKS keystore password Secret
# =============================================================================
# Required by the cert-manager Certificate CRs in tls/certificate-crs.yaml:
# both cmf-tls and flink-kafka-client-tls reference
# `passwordSecretRef: {name: flink-jks-password, key: password}` to encrypt
# the JKS keystore/truststore files they emit. This Secret MUST exist
# BEFORE the Certificates reconcile, or cert-manager will fail with
# `Secret "flink-jks-password" not found`.
#
# NOT in layers/05-flink/kustomization.yaml resources: — operator copies
# this template, fills in the password, and applies it out-of-band.
# Document the password in your secret-management system (Vault, etc.) —
# the SAME password is what the Flink SQL client uses to open
# /opt/certs/keystore.jks via the ssl.keystore.password property.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: flink-jks-password
  namespace: confluent
  labels:
    goodlabs.io/layer: "05-flink"
type: Opaque
stringData:
  # Any non-empty string. Use openssl rand -base64 32 or similar for a strong
  # password. Same value must be referenced by FlinkApplication SQL's
  # 'properties.ssl.keystore.password' and 'value.avro-confluent.ssl.keystore.password'.
  password: <PLACEHOLDER_JKS_KEYSTORE_PASSWORD>
