---
# =============================================================================
# secrets.template/flink-kafka-client-credentials.yaml — Flink→Kafka mTLS Secret template
# =============================================================================
# Template for the K8s Secret containing the Flink job's mutual-TLS credentials
# for authenticating to the Kafka brokers. Flink SQL connector uses JKS
# keystore/truststore format (standard Java SSL/mTLS interop).
#
# The keystore identity (CN/SAN) must match a ConfluentRolebinding subject so
# that the broker grants the Flink job the correct topic/SR access (see
# rolebindings/flink-job-runtime.yaml for the least-privilege RBAC bindings).
#
# DO NOT commit real values — replace every <PLACEHOLDER> before applying.
# This file is intentionally excluded from kustomization.yaml resources:.
#
# Usage:
#   cp layers/05-flink/secrets.template/flink-kafka-client-credentials.yaml /tmp/flink-kafka-creds.yaml
#   # Replace all <PLACEHOLDER> values
#   oc apply -f /tmp/flink-kafka-creds.yaml -n confluent
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: flink-kafka-client-tls
  namespace: confluent
type: Opaque
data:
  # JKS keystore containing the Flink client certificate + private key.
  # Generate from the cert-manager-issued flink-kafka-client-tls Certificate:
  #   openssl pkcs12 -export -in tls.crt -inkey tls.key -out keystore.p12
  #   keytool -importkeystore -srckeystore keystore.p12 -destkeystore keystore.jks -deststoretype JKS
  keystore.jks: <PLACEHOLDER_FLINK_KEYSTORE_JKS_BASE64>
  # JKS truststore containing the CA certificate (confluent-ca-issuer CA PEM).
  #   keytool -importcert -alias confluent-ca -file ca.crt -keystore truststore.jks
  truststore.jks: <PLACEHOLDER_FLINK_TRUSTSTORE_JKS_BASE64>
  # Keystore password (used by Flink SQL connector WITH clause)
  keystore.password: <PLACEHOLDER_KEYSTORE_PASSWORD_BASE64>
  # Truststore password
  truststore.password: <PLACEHOLDER_TRUSTSTORE_PASSWORD_BASE64>
