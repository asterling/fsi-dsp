apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# =============================================================================
# 03-schema-governance — Schema Registry governance hardening layer
# =============================================================================
# Enforces FULL_TRANSITIVE compatibility globally and per-subject, restricts
# hard-delete via RBAC (layer 01 must have applied first), and deploys an
# idempotent bootstrap Job to initialize the SR configuration via REST API.
# =============================================================================

resources:
  # Idempotent bootstrap Job — PUTs FULL_TRANSITIVE config and per-subject mode
  # via SR REST API. The one sanctioned explicit/imperative step.
  - job-sr-bootstrap.yaml

patches:
  # SchemaRegistry CR: configOverrides for server-side governance defaults
  - path: patches/schemaregistry-governance.yaml
    target:
      kind: SchemaRegistry
      name: schemaregistry
