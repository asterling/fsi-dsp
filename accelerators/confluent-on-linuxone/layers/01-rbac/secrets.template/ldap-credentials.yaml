apiVersion: v1
kind: Secret
metadata:
  name: ldap-credentials
  namespace: confluent
type: Opaque
stringData:
  # LDAP bind credentials for MDS LDAP provider.
  # Use a dedicated read-only service account — not an admin account.
  # Retrieve from Vault: ${vault:secret/confluent/ldap-bind}
  ldap.user: <PLACEHOLDER_LDAP_BIND_DN>
  ldap.password: <PLACEHOLDER_LDAP_BIND_PASSWORD>
---
apiVersion: v1
kind: Secret
metadata:
  name: mds-client-credentials
  namespace: confluent
type: Opaque
stringData:
  # MDS client credentials used by SR, C3, and REST Proxy to authenticate
  # to MDS for token validation. Each component should have its own service account.
  bearer.txt: <PLACEHOLDER_MDS_CLIENT_BEARER_TOKEN>
