---
# =============================================================================
# Kubernetes ServiceAccount for connect-databases pods (ADR-012)
# =============================================================================
# Pod-level workload identity only; Kafka auth is via mTLS with cert-manager-
# minted certs (layer 02-tls).
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: connect-databases
  namespace: confluent
  labels:
    app.kubernetes.io/part-of: fsi-kafka-platform
    app.kubernetes.io/component: database-connectors
