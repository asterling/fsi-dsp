---
# =============================================================================
# Database connector DLQ topics -- one per connector (ADR-012)
# =============================================================================
# Distinct prefix from lakehouse DLQs (database.dlq.* vs lakehouse.dlq.*)
# so dashboards can filter by purpose. Best-effort tier with 7-day retention.
# =============================================================================
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: database-dlq-mongodb-source-corebanking-member-profile
  namespace: confluent
  labels:
    fsi.io/dlq-for: database-mongodb-source-corebanking-member-profile
    fsi.io/sla-tier: best-effort
spec:
  name: database.dlq.mongodb-source-corebanking-member-profile
  replicas: 3
  partitionCount: 3
  configs:
    retention.ms: "604800000"
    cleanup.policy: "delete"
    compression.type: "zstd"
    min.insync.replicas: "2"
---
