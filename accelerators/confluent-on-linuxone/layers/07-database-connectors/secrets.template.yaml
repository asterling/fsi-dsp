---
# =============================================================================
# database-creds Secret -- TEMPLATE / POINTER ONLY (ADR-012)
# =============================================================================
# Documentation pointer; the actual K8s Secret is reconciled by Vault-Agent
# (or ExternalSecrets Operator) and MUST NOT be committed with real values.
#
# Mirrors the bug_018 pattern from layer 06: cert-manager owns TLS material,
# Vault-Agent owns app credentials. No real secrets in the repo.
#
# Required Secret keys -- populate via Vault-Agent annotations on the
# connect-databases pods or via an ExternalSecret CR pointing at:
#
#   secret/fsi/mongodb#connection_uri      -> mongodb_connection_uri
#   secret/fsi/redis#username              -> redis_username
#   secret/fsi/redis#password              -> redis_password
#   secret/fsi/cockroachdb#username        -> cockroachdb_username
#   secret/fsi/cockroachdb#password        -> cockroachdb_password
#   secret/fsi/postgres#cdc_username       -> postgres_cdc_username
#   secret/fsi/postgres#cdc_password       -> postgres_cdc_password
#   secret/fsi/postgres#username           -> postgres_username
#   secret/fsi/postgres#password           -> postgres_password
#   secret/fsi/sr#api_key + #api_secret    -> sr_user_info (joined by ":")
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: database-creds
  namespace: confluent
  annotations:
    fsi.io/managed-by: "vault-agent"
    fsi.io/vault-paths: "secret/fsi/mongodb, secret/fsi/redis, secret/fsi/cockroachdb, secret/fsi/postgres, secret/fsi/sr"
type: Opaque
# data: <populated by Vault-Agent at reconcile time>
