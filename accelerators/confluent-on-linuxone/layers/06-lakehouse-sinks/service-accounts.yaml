---
# =============================================================================
# Kubernetes ServiceAccount for the connect-lakehouse pods
# =============================================================================
# Used for pod-level workload identity, NOT Kafka authentication. Kafka auth
# is via mTLS with cert-manager-minted certs (see layer 02-tls).
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: connect-lakehouse
  namespace: confluent
  labels:
    app.kubernetes.io/part-of: fsi-kafka-platform
    app.kubernetes.io/component: lakehouse-sinks
