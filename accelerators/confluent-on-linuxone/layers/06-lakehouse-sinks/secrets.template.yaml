---
# =============================================================================
# lakehouse-creds Secret -- TEMPLATE / POINTER ONLY
# =============================================================================
# This file is a documentation pointer; the actual K8s Secret is reconciled
# by Vault-Agent (or External Secrets Operator) and MUST NOT be committed
# with real values.
#
# Per the bug_018 fix (commit eeeee3a) for TLS, the platform pattern is:
#   - cert-manager owns TLS material (no JKS templates in the repo)
#   - Vault-Agent owns app credentials (no plaintext secrets in the repo)
#
# Required Secret keys -- populate via Vault-Agent annotations on the
# connect-lakehouse pods or via an ExternalSecret CR pointing at the same
# Vault paths used elsewhere in the platform:
#
#   secret/fsi/databricks#token                       -> databricks_token
#   secret/fsi/aws-databricks-staging#access_key_id    -> databricks_s3_access_key_id
#   secret/fsi/aws-databricks-staging#secret_access_key -> databricks_s3_secret_access_key
#   secret/fsi/snowflake#private_key                   -> snowflake_private_key
#   secret/fsi/snowflake#private_key_passphrase        -> snowflake_private_key_passphrase
#   secret/fsi/sr#api_key + secret/fsi/sr#api_secret   -> sr_user_info (joined by ":")
#
# When Vault-Agent is configured, this Secret appears automatically; this
# file exists solely to document the contract.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: lakehouse-creds
  namespace: confluent
  annotations:
    fsi.io/managed-by: "vault-agent"
    fsi.io/vault-paths: "secret/fsi/databricks, secret/fsi/aws-databricks-staging, secret/fsi/snowflake, secret/fsi/sr"
type: Opaque
# data: <populated by Vault-Agent at reconcile time>
