apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
spec:
  # Replace autoGeneratedCerts with a named Secret containing real PEM certs.
  # Certs are minted by ansible/roles/cp_mtls or LinuxOne/ansible-mtls/
  # and stored as K8s Secrets (never committed to the repo).
  tls:
    secretRef: kafka-tls
    # FIPS mode requires OCP to be installed with fips: true.
    # spec.tls.fips.enabled ONLY takes effect on an already-FIPS cluster.
    # See KNOWN-GAPS.md and layers/02-tls/README.md.
    fips:
      enabled: true
  # s390x node affinity — sourced from scenarios/cfk-openshift-linuxone/values/kafka.yaml
  podTemplate:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - s390x
    tolerations:
      - key: "arch"
        operator: "Equal"
        value: "s390x"
        effect: "NoSchedule"
  listeners:
    # Internal listener: mTLS — broker-to-broker and component-to-broker
    internal:
      authentication:
        type: mtls
        # principalMappingRules maps client cert CN to Kafka principal
        principalMappingRules:
          - "RULE:.*CN=(.*?),.*/$1/"
          - DEFAULT
      tls:
        enabled: true
    # External listener: Route edge-TLS (OCP terminates TLS, plain to broker)
    # This keeps the external listener accessible without client cert.
    external:
      authentication:
        type: plain
      tls:
        enabled: true
  configOverrides:
    server:
      # Pin to TLS 1.2/1.3 only — TLS 1.0 and 1.1 are prohibited in FSI (PCI-DSS 4.x)
      - ssl.enabled.protocols=TLSv1.3,TLSv1.2
      # FIPS-approved cipher suites for s390x (CPACF-accelerated AES-GCM, SHA-2)
      # These suites are supported by both IBM Semeru 17 and OpenJDK 17 on s390x
      - ssl.cipher.suites=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
