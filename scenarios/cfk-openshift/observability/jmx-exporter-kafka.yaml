# =============================================================================
# JMX Exporter ConfigMap for Kafka Brokers -- CFK on OpenShift
# =============================================================================
# Activates the jmx-exporter-config.yaml metric patterns for CFK Kafka
# brokers. CFK exposes JMX on port 7778 by default (no sidecar needed).
#
# This ConfigMap provides the same JMX rules as observability/grafana/
# jmx-exporter-config.yaml, adapted for CFK (no hostPort, CFK uses built-in
# port 7778).
#
# Usage:
#   1. Apply this ConfigMap: oc apply -f observability/jmx-exporter-kafka.yaml
#   2. The Kafka CR in values/kafka.yaml already includes matching Prometheus
#      rules in spec.metrics.prometheus.rules
#   3. Apply the PodMonitor: oc apply -f observability/pod-monitor-kafka.yaml
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-jmx-exporter-config
  namespace: confluent
data:
  jmx-exporter.yaml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true

    rules:
      # -- Cluster Health metrics --

      - pattern: "kafka.server<type=ReplicaManager, name=UnderReplicatedPartitions><>Value"
        name: kafka_server_replica_manager_under_replicated_partitions
        type: GAUGE
        help: "Number of under-replicated partitions (0 = healthy)"

      - pattern: "kafka.server<type=BrokerTopicMetrics, name=MessagesInPerSec><>OneMinuteRate"
        name: kafka_server_broker_topic_metrics_messages_in_per_sec
        type: GAUGE
        help: "Incoming message rate (messages/sec, 1-minute average)"

      - pattern: "kafka.server<type=BrokerTopicMetrics, name=BytesInPerSec><>OneMinuteRate"
        name: kafka_server_broker_topic_metrics_bytes_in_per_sec
        type: GAUGE
        help: "Incoming byte rate (bytes/sec, 1-minute average)"

      - pattern: "kafka.server<type=BrokerTopicMetrics, name=BytesOutPerSec><>OneMinuteRate"
        name: kafka_server_broker_topic_metrics_bytes_out_per_sec
        type: GAUGE
        help: "Outgoing byte rate (bytes/sec, 1-minute average)"

      - pattern: "kafka.controller<type=KafkaController, name=ActiveControllerCount><>Value"
        name: kafka_controller_active_controller_count
        type: GAUGE
        help: "Number of active controllers (expected: 1)"

      - pattern: "kafka.server<type=ReplicaManager, name=PartitionCount><>Value"
        name: kafka_server_replica_manager_partition_count
        type: GAUGE
        help: "Total partition count on this broker"

      # -- Consumer Lag metrics --

      - pattern: "kafka.server<type=FetcherLagMetrics, name=ConsumerLag, clientId=(.*), topic=(.*), partition=(.*)><>Value"
        name: kafka_server_fetcher_lag_metrics_consumer_lag
        type: GAUGE
        help: "Consumer lag in records for a specific client/topic/partition"
        labels:
          client_id: "$1"
          topic: "$2"
          partition: "$3"

      # -- Request metrics --

      - pattern: "kafka.network<type=RequestMetrics, name=RequestsPerSec, request=(.*)><>OneMinuteRate"
        name: kafka_network_request_metrics_requests_per_sec
        type: GAUGE
        help: "Request rate by type (produce, fetch, metadata, etc.)"
        labels:
          request: "$1"

      # -- ISR metrics --

      - pattern: "kafka.server<type=ReplicaManager, name=IsrShrinksPerSec><>OneMinuteRate"
        name: kafka_server_replica_manager_isr_shrinks_per_sec
        type: GAUGE
        help: "Rate of ISR shrinks (indicates potential broker issues)"

      - pattern: "kafka.server<type=ReplicaManager, name=IsrExpandsPerSec><>OneMinuteRate"
        name: kafka_server_replica_manager_isr_expands_per_sec
        type: GAUGE
        help: "Rate of ISR expansions (recovery indicator)"
