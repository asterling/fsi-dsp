# =============================================================================
# FlinkDeployment -- Tumbling Window Aggregation
# =============================================================================
# CFK Flink equivalent of reference/flink-sql/tumbling-window-aggregation.sql.
# Unlike CC Flink, CFK Flink requires explicit CREATE TABLE with avro-confluent
# format (Pitfall 5 from research).
#
# 1-minute transaction volume aggregation by domain. Produces a continuous
# summary of transaction counts, totals, and averages into an output topic
# for dashboards and alerting.
#
# Deploy:
#   kubectl apply -f flink/examples/tumbling-window.yaml -n flink
# =============================================================================

apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: fsi-tumbling-window
  namespace: flink
  labels:
    fsi.pattern: tumbling-window
    fsi.domain: corebanking
spec:
  image: fsi-flink:1.20
  flinkVersion: v1_20
  serviceAccount: flink

  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "4"
    # Prometheus metrics reporter
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"
    # State backend and checkpointing
    state.backend: hashmap
    state.checkpoints.dir: file:///flink-data/checkpoints
    execution.checkpointing.interval: "60000"

  jobManager:
    resource:
      memory: "2048m"
      cpu: 1

  taskManager:
    resource:
      memory: "4096m"
      cpu: 2

  job:
    jarURI: local:///opt/flink/usrlib/fsi-sql-runner.jar
    entryClass: org.apache.flink.table.gateway.SqlRunner
    args: ["--sql-file", "/opt/flink/sql/tumbling-window.sql"]
    parallelism: 2
    upgradeMode: savepoint
    state: running

  # -- Pod template with JMX exporter sidecar config (D-11) and SQL mount --
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          volumeMounts:
            - name: jmx-exporter-config
              mountPath: /opt/jmx-exporter
            - name: sql-scripts
              mountPath: /opt/flink/sql
      volumes:
        - name: jmx-exporter-config
          configMap:
            name: flink-jmx-exporter-config
        - name: sql-scripts
          configMap:
            name: fsi-tumbling-window-sql

---
# =============================================================================
# ConfigMap -- Tumbling Window SQL
# =============================================================================
# CFK port of reference/flink-sql/tumbling-window-aggregation.sql.
# CFK Flink requires explicit CREATE TABLE (CC Flink auto-discovers SR subjects).
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: fsi-tumbling-window-sql
  namespace: flink
data:
  tumbling-window.sql: |
    -- Source: CFK port of reference/flink-sql/tumbling-window-aggregation.sql
    -- CFK Flink requires explicit CREATE TABLE (CC Flink auto-discovers SR subjects)

    CREATE TABLE account_transaction (
      transaction_id STRING,
      account_number STRING,
      amount DECIMAL(15, 2),
      transaction_type STRING,
      `timestamp` TIMESTAMP(3),
      WATERMARK FOR `timestamp` AS `timestamp` - INTERVAL '5' SECOND
    ) WITH (
      'connector' = 'kafka',
      'topic' = 'corebanking.transactions.v1.account-transaction',
      'properties.bootstrap.servers' = 'kafka.confluent.svc.cluster.local:9092',
      'value.format' = 'avro-confluent',
      'value.avro-confluent.url' = 'http://schemaregistry.confluent.svc.cluster.local:8081',
      'properties.security.protocol' = 'SSL',
      'properties.ssl.truststore.location' = '/opt/certs/truststore.jks',
      'scan.startup.mode' = 'latest-offset'
    );

    CREATE TABLE txn_volume_1m (
      window_start TIMESTAMP(3),
      window_end TIMESTAMP(3),
      transaction_count BIGINT,
      total_amount DECIMAL(15, 2),
      avg_amount DECIMAL(15, 2),
      min_amount DECIMAL(15, 2),
      max_amount DECIMAL(15, 2)
    ) WITH (
      'connector' = 'kafka',
      'topic' = 'corebanking.analytics.v1.txn-volume-1m',
      'properties.bootstrap.servers' = 'kafka.confluent.svc.cluster.local:9092',
      'value.format' = 'avro-confluent',
      'value.avro-confluent.url' = 'http://schemaregistry.confluent.svc.cluster.local:8081',
      'properties.security.protocol' = 'SSL',
      'properties.ssl.truststore.location' = '/opt/certs/truststore.jks'
    );

    INSERT INTO txn_volume_1m
    SELECT
      window_start,
      window_end,
      COUNT(*) AS transaction_count,
      SUM(amount) AS total_amount,
      AVG(amount) AS avg_amount,
      MIN(amount) AS min_amount,
      MAX(amount) AS max_amount
    FROM TABLE(
      TUMBLE(TABLE account_transaction, DESCRIPTOR(`timestamp`), INTERVAL '1' MINUTE)
    )
    GROUP BY window_start, window_end;
