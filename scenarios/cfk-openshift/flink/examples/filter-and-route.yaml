# =============================================================================
# FlinkDeployment -- Filter-and-Route (EXECUTE STATEMENT SET)
# =============================================================================
# CFK port of reference/flink-sql/filter-and-route.sql.
# Uses EXECUTE STATEMENT SET for multi-output routing.
#
# Routes transactions to separate topics based on amount and type:
#   - High-value transactions (>10000) -> fraud.alerts.v1.high-value-txn
#   - Wire transfers >50000 -> compliance.screening.v1.flagged-txn
#
# Deploy:
#   kubectl apply -f flink/examples/filter-and-route.yaml -n flink
# =============================================================================

apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: fsi-filter-and-route
  namespace: flink
  labels:
    fsi.pattern: filter-and-route
    fsi.domain: corebanking
spec:
  image: fsi-flink:1.20
  flinkVersion: v1_20
  serviceAccount: flink

  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "4"
    # Prometheus metrics reporter
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"
    # State backend and checkpointing
    state.backend: hashmap
    state.checkpoints.dir: file:///flink-data/checkpoints
    execution.checkpointing.interval: "60000"

  jobManager:
    resource:
      memory: "2048m"
      cpu: 1

  taskManager:
    resource:
      memory: "4096m"
      cpu: 2

  job:
    jarURI: local:///opt/flink/usrlib/fsi-sql-runner.jar
    entryClass: org.apache.flink.table.gateway.SqlRunner
    args: ["--sql-file", "/opt/flink/sql/filter-and-route.sql"]
    parallelism: 2
    upgradeMode: savepoint
    state: running

  # -- Pod template with JMX exporter sidecar config (D-11) and SQL mount --
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          volumeMounts:
            - name: jmx-exporter-config
              mountPath: /opt/jmx-exporter
            - name: sql-scripts
              mountPath: /opt/flink/sql
      volumes:
        - name: jmx-exporter-config
          configMap:
            name: flink-jmx-exporter-config
        - name: sql-scripts
          configMap:
            name: fsi-filter-and-route-sql

---
# =============================================================================
# ConfigMap -- Filter-and-Route SQL
# =============================================================================
# CFK port of reference/flink-sql/filter-and-route.sql.
# CFK Flink requires explicit CREATE TABLE (CC Flink auto-discovers SR subjects).
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: fsi-filter-and-route-sql
  namespace: flink
data:
  filter-and-route.sql: |
    -- Source: CFK port of reference/flink-sql/filter-and-route.sql
    -- Uses EXECUTE STATEMENT SET for multi-output routing

    -- Source: real-time transaction stream
    CREATE TABLE account_transaction (
      transaction_id STRING,
      account_number STRING,
      amount DECIMAL(15, 2),
      transaction_type STRING,
      `timestamp` TIMESTAMP(3),
      WATERMARK FOR `timestamp` AS `timestamp` - INTERVAL '5' SECOND
    ) WITH (
      'connector' = 'kafka',
      'topic' = 'corebanking.transactions.v1.account-transaction',
      'properties.bootstrap.servers' = 'kafka.confluent.svc.cluster.local:9092',
      'value.format' = 'avro-confluent',
      'value.avro-confluent.url' = 'http://schemaregistry.confluent.svc.cluster.local:8081',
      'properties.security.protocol' = 'SSL',
      'properties.ssl.truststore.location' = '/opt/certs/truststore.jks',
      'scan.startup.mode' = 'latest-offset'
    );

    -- Sink: high-value transactions for fraud investigation
    CREATE TABLE high_value_txn (
      transaction_id STRING,
      account_number STRING,
      amount DECIMAL(15, 2),
      transaction_type STRING,
      `timestamp` TIMESTAMP(3)
    ) WITH (
      'connector' = 'kafka',
      'topic' = 'fraud.alerts.v1.high-value-txn',
      'properties.bootstrap.servers' = 'kafka.confluent.svc.cluster.local:9092',
      'value.format' = 'avro-confluent',
      'value.avro-confluent.url' = 'http://schemaregistry.confluent.svc.cluster.local:8081',
      'properties.security.protocol' = 'SSL',
      'properties.ssl.truststore.location' = '/opt/certs/truststore.jks'
    );

    -- Sink: flagged wire transfers for compliance screening
    CREATE TABLE flagged_txn (
      transaction_id STRING,
      account_number STRING,
      amount DECIMAL(15, 2),
      transaction_type STRING,
      `timestamp` TIMESTAMP(3)
    ) WITH (
      'connector' = 'kafka',
      'topic' = 'compliance.screening.v1.flagged-txn',
      'properties.bootstrap.servers' = 'kafka.confluent.svc.cluster.local:9092',
      'value.format' = 'avro-confluent',
      'value.avro-confluent.url' = 'http://schemaregistry.confluent.svc.cluster.local:8081',
      'properties.security.protocol' = 'SSL',
      'properties.ssl.truststore.location' = '/opt/certs/truststore.jks'
    );

    EXECUTE STATEMENT SET
    BEGIN
      INSERT INTO high_value_txn
      SELECT * FROM account_transaction WHERE amount > 10000;

      INSERT INTO flagged_txn
      SELECT * FROM account_transaction WHERE transaction_type = 'WIRE' AND amount > 50000;
    END;
