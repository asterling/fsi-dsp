# =============================================================================
# Connect CR -- Dedicated MirrorMaker 2 Cluster (per D-07)
# =============================================================================
# Dedicated Connect cluster for MirrorMaker 2 connectors. Separate from
# application Connect per D-07 -- prevents MM2 restarts from disrupting
# application connectors.
#
# MM2 connectors (MirrorSourceConnector, MirrorCheckpointConnector,
# MirrorHeartbeatConnector) are deployed as Connector CRDs referencing this
# cluster. See mm2/ directory for connector definitions.
#
# CFK does not have a dedicated KafkaMirrorMaker2 CRD (that is Strimzi-specific).
# The D-07 intent of independent lifecycle is achieved via this dedicated
# Connect cluster.
# =============================================================================

apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect-mm2
  namespace: confluent
spec:
  replicas: 2
  image:
    application: confluentinc/cp-server-connect:7.6.0

  # -- TLS: auto-generated certs via cert-manager --
  tls:
    autoGeneratedCerts: true

  # -- Kafka dependency --
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      authentication:
        type: mtls
      tls:
        enabled: true
