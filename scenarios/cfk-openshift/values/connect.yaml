# =============================================================================
# Connect CR -- CFK on OpenShift (Application Connectors)
# =============================================================================
# Deploys a 2-replica Connect cluster for application connectors (JDBC, etc.).
#
# NOTE: This is the application Connect cluster only. MirrorMaker 2 connectors
# run on a dedicated connect-mm2 cluster (see connect-mm2.yaml) to ensure
# independent lifecycle and prevent MM2 restarts from disrupting application
# connectors.
# =============================================================================

apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: confluent
spec:
  replicas: 2
  image:
    application: confluentinc/cp-server-connect:7.6.0

  # -- TLS: auto-generated certs via cert-manager --
  tls:
    autoGeneratedCerts: true

  # -- Kafka dependency --
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      authentication:
        type: mtls
      tls:
        enabled: true
    schemaRegistry:
      url: https://schemaregistry.confluent.svc.cluster.local:8081
      tls:
        enabled: true
