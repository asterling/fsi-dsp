# =============================================================================
# SchemaRegistry CR -- CFK on OpenShift
# =============================================================================
# Deploys a 2-replica Schema Registry cluster with TLS, connected to the
# CFK-managed Kafka cluster.
#
# Schema compatibility modes are set per-subject (not on this CR).
# SLA-tier-derived compatibility is enforced at registration time via CI.
# =============================================================================

apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: confluent
spec:
  replicas: 2
  image:
    application: confluentinc/cp-schema-registry:7.6.0

  # -- TLS: auto-generated certs via cert-manager --
  tls:
    autoGeneratedCerts: true

  # -- Kafka dependency --
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      authentication:
        type: mtls
      tls:
        enabled: true
