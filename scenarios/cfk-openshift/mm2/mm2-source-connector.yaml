# =============================================================================
# MirrorSourceConnector -- MM2 DR Replication (per D-05, D-07)
# =============================================================================
# Replicates topics from the East (primary) cluster to the West (DR) cluster
# using MirrorMaker 2. Runs on the dedicated connect-mm2 cluster.
#
# Replicated topics appear as east.{original-topic-name} on DR cluster
# (prefix-based naming per D-05). Consumers on DR read from prefixed topics.
#
# CFK does not have a dedicated KafkaMirrorMaker2 CRD (that is Strimzi-specific).
# MM2 runs as Connector CRDs on a Connect cluster. D-07's intent of independent
# lifecycle is achieved via the dedicated connect-mm2 cluster.
# =============================================================================

apiVersion: platform.confluent.io/v1beta1
kind: Connector
metadata:
  name: mm2-source-east-west
  namespace: confluent
spec:
  class: org.apache.kafka.connect.mirror.MirrorSourceConnector
  taskMax: 4
  connectClusterRef:
    name: connect-mm2
  configs:
    # -- Cluster aliases --
    source.cluster.alias: "east"
    target.cluster.alias: "west"

    # -- Bootstrap servers --
    # Replace {{EAST_BOOTSTRAP}} with the actual East cluster bootstrap endpoint
    source.cluster.bootstrap.servers: "{{EAST_BOOTSTRAP}}"
    target.cluster.bootstrap.servers: "kafka.confluent.svc.cluster.local:9092"

    # -- Topic selection --
    topics: ".*"
    topics.exclude: ".*\\.internal,.*\\.replica,__.*"

    # -- Replication settings --
    replication.factor: "3"
    sync.topic.configs.enabled: "true"
    sync.topic.acls.enabled: "true"

    # -- mTLS authentication for source cluster --
    source.cluster.security.protocol: "SSL"
    source.cluster.ssl.keystore.location: "/mnt/secrets/source/keystore.jks"
    source.cluster.ssl.keystore.password: "${file:/mnt/secrets/source/credentials:keystore.password}"
    source.cluster.ssl.truststore.location: "/mnt/secrets/source/truststore.jks"
    source.cluster.ssl.truststore.password: "${file:/mnt/secrets/source/credentials:truststore.password}"

    # -- mTLS authentication for target cluster --
    target.cluster.security.protocol: "SSL"
    target.cluster.ssl.keystore.location: "/mnt/secrets/target/keystore.jks"
    target.cluster.ssl.keystore.password: "${file:/mnt/secrets/target/credentials:keystore.password}"
    target.cluster.ssl.truststore.location: "/mnt/secrets/target/truststore.jks"
    target.cluster.ssl.truststore.password: "${file:/mnt/secrets/target/credentials:truststore.password}"
