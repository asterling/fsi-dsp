# =============================================================================
# Kafka Connect Group Variables
# =============================================================================
# Connect-specific configuration applied to all hosts in the kafka_connect group.
# =============================================================================

kafka_connect_custom_properties:
  # -------------------------------------------------------------------------
  # Distributed mode internal topic replication
  # -------------------------------------------------------------------------
  config.storage.replication.factor: 3
  offset.storage.replication.factor: 3
  status.storage.replication.factor: 3

  # -------------------------------------------------------------------------
  # Plugin path for JDBC and custom connectors
  # Install connector JARs to /usr/share/confluent-hub-components
  # -------------------------------------------------------------------------
  plugin.path: "/usr/share/java,/usr/share/confluent-hub-components"

  # -------------------------------------------------------------------------
  # Key and value converter defaults (Avro with Schema Registry)
  # -------------------------------------------------------------------------
  # key.converter: "io.confluent.connect.avro.AvroConverter"
  # value.converter: "io.confluent.connect.avro.AvroConverter"
  # key.converter.schema.registry.url: "https://sr-east-1:8081"
  # value.converter.schema.registry.url: "https://sr-east-1:8081"

  # -------------------------------------------------------------------------
  # Producer and consumer overrides for Connect internal operations
  # -------------------------------------------------------------------------
  # producer.override.acks: "all"
  # consumer.override.auto.offset.reset: "earliest"
