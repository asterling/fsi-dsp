  # ---------------------------------------------------------------------------
  # Connect Alerts
  # ---------------------------------------------------------------------------
  - orgId: 1
    name: fsi-kafka-connect
    folder: FSI Kafka
    interval: 1m
    rules:
      - uid: fsi-connect-task-failed
        title: ConnectTaskFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "${DS_PROMETHEUS}"
            model:
              expr: "count(kafka_connect_connector_status{state=\"failed\"}) or vector(0)"
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 1m
        labels:
          team: fsi-kafka
          severity: critical
        annotations:
          summary: "Kafka Connect task in FAILED state"
          description: "One or more Kafka Connect connector tasks are in FAILED state. Check Connect logs and restart if appropriate. Failed count: {{ $value }}."

      - uid: fsi-connect-task-restart-loop
        title: ConnectTaskRestartLoop
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "${DS_PROMETHEUS}"
            model:
              expr: "increase(kafka_connect_task_restart_total[15m])"
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: max
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
        for: 1m
        labels:
          team: fsi-kafka
          severity: warning
        annotations:
          summary: "Kafka Connect task restart loop detected"
          description: "A Kafka Connect task has restarted {{ $value }} times in the last 15 minutes (threshold: 3). Investigate root cause to prevent repeated failures."

  # ---------------------------------------------------------------------------
  # Cluster Health Alerts
  # ---------------------------------------------------------------------------
  - orgId: 1
    name: fsi-kafka-cluster-health
    folder: FSI Kafka
    interval: 1m
    rules:
      - uid: fsi-under-replicated-partitions
        title: UnderReplicatedPartitions
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "${DS_PROMETHEUS}"
            model:
              expr: "sum(kafka_server_replica_manager_under_replicated_partitions{kafka_id=\"$CLUSTER_ID\"})"
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 5m
        labels:
          team: fsi-kafka
          severity: critical
        annotations:
          summary: "Under-replicated partitions detected"
          description: "{{ $value }} partition(s) are under-replicated for more than 5 minutes on cluster {{ $labels.kafka_id }}. This indicates broker health issues or network problems. Investigate immediately."

      - uid: fsi-no-active-controller
        title: NoActiveController
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "${DS_PROMETHEUS}"
            model:
              expr: "kafka_controller_active_controller_count{kafka_id=\"$CLUSTER_ID\"}"
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 1m
        labels:
          team: fsi-kafka
          severity: critical
        annotations:
          summary: "No active Kafka controller"
          description: "No active controller elected on cluster {{ $labels.kafka_id }}. This is a critical condition -- the cluster cannot process metadata requests or partition leadership changes. Investigate immediately."

  # ---------------------------------------------------------------------------
  # Flink Alerts
  # ---------------------------------------------------------------------------
  - orgId: 1
    name: fsi-kafka-flink
    folder: FSI Kafka
    interval: 1m
    rules:
      - uid: fsi-flink-pending-records-warn
        title: FlinkPendingRecords - Warning
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "${DS_PROMETHEUS}"
            model:
              expr: "max by (statement_name) (io_confluent_flink_pending_records{resource_type=\"flink_statement\"})"
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1000]
              refId: C
        for: 5m
        labels:
          team: fsi-kafka
          severity: warning
        annotations:
          summary: "Flink statement has >1000 pending records"
          description: "Flink statement {{ $labels.statement_name }} has {{ $value }} pending records. This may indicate backpressure or slow processing."

      - uid: fsi-flink-pending-records-alert
        title: FlinkPendingRecords - Alert
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "${DS_PROMETHEUS}"
            model:
              expr: "max by (statement_name) (io_confluent_flink_pending_records{resource_type=\"flink_statement\"})"
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [10000]
              refId: C
        for: 5m
        labels:
          team: fsi-kafka
          severity: critical
        annotations:
          summary: "Flink statement has >10000 pending records -- backpressure critical"
          description: "Flink statement {{ $labels.statement_name }} has {{ $value }} pending records. Investigate immediately: check source throughput, statement complexity, and CFU allocation."

      - uid: fsi-flink-throughput-drop
        title: FlinkThroughputDrop
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "${DS_PROMETHEUS}"
            model:
              expr: "rate(io_confluent_flink_num_records_out{resource_type=\"flink_statement\"}[10m])"
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 10m
        labels:
          team: fsi-kafka
          severity: warning
        annotations:
          summary: "Flink statement output throughput dropped to zero"
          description: "Flink statement {{ $labels.statement_name }} has produced < 1 record/sec for 10 minutes. The job may be stalled, failed, or its source topic is empty."
