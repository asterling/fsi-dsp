# =============================================================================
# FSI Kafka Platform -- Grafana Alerting Rules
# =============================================================================
# Grafana provisioning file format. Place in /etc/grafana/provisioning/alerting/
# or import via Grafana API.
#
# SLA-tier thresholds from ADR-008 (docs/adr/008-dr-tier-classification.md)
# and fsi-dr.sh threshold functions (_tier_warn_threshold, _tier_alert_threshold).
# =============================================================================

apiVersion: 1

groups:
  # ---------------------------------------------------------------------------
  # Mirror Lag Alerts (DR Readiness)
  # ---------------------------------------------------------------------------
  - orgId: 1
    name: fsi-kafka-mirror-lag
    folder: FSI Kafka
    interval: 1m
    rules:
      # -- Critical tier: warn=30s, alert=60s --
      - uid: fsi-mirror-lag-critical-warn
        title: MirrorLagCritical - Warning
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "${DS_PROMETHEUS}"
            model:
              expr: "max by (topic) (confluent_kafka_server_cluster_link_mirror_topic_offset_lag{kafka_id=\"$CLUSTER_ID\"} / on(topic) rate(confluent_kafka_server_received_records{kafka_id=\"$CLUSTER_ID\"}[5m]))"
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [30]
              refId: C
        for: 1m
        labels:
          team: fsi-kafka
          sla_tier: critical
          severity: warning
        annotations:
          summary: "Mirror lag exceeds 30s for critical-tier topic"
          description: "Mirror lag exceeds warn threshold for critical tier (30s). Monitor for further degradation. Topic: {{ $labels.topic }}, Current lag: {{ $value }}s"

      - uid: fsi-mirror-lag-critical-alert
        title: MirrorLagCritical - Alert
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "${DS_PROMETHEUS}"
            model:
              expr: "max by (topic) (confluent_kafka_server_cluster_link_mirror_topic_offset_lag{kafka_id=\"$CLUSTER_ID\"} / on(topic) rate(confluent_kafka_server_received_records{kafka_id=\"$CLUSTER_ID\"}[5m]))"
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [60]
              refId: C
        for: 1m
        labels:
          team: fsi-kafka
          sla_tier: critical
          severity: critical
        annotations:
          summary: "Mirror lag exceeds 60s for critical-tier topic -- potential data loss risk"
          description: "Mirror lag exceeds alert threshold for critical tier (60s). Potential data loss risk. Evaluate failover readiness. Topic: {{ $labels.topic }}, Current lag: {{ $value }}s"

      # -- Standard tier: warn=300s (5m), alert=900s (15m) --
      - uid: fsi-mirror-lag-standard-warn
        title: MirrorLagStandard - Warning
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "${DS_PROMETHEUS}"
            model:
              expr: "max by (topic) (confluent_kafka_server_cluster_link_mirror_topic_offset_lag{kafka_id=\"$CLUSTER_ID\"} / on(topic) rate(confluent_kafka_server_received_records{kafka_id=\"$CLUSTER_ID\"}[5m]))"
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [300]
              refId: C
        for: 5m
        labels:
          team: fsi-kafka
          sla_tier: standard
          severity: warning
        annotations:
          summary: "Mirror lag exceeds 5m for standard-tier topic"
          description: "Mirror lag exceeds warn threshold for standard tier (300s). Monitor for further degradation. Topic: {{ $labels.topic }}, Current lag: {{ $value }}s"

      - uid: fsi-mirror-lag-standard-alert
