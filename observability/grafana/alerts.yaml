      - uid: fsi-mirror-lag-besteffort-alert
        title: MirrorLagBestEffort - Alert
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: "${DS_PROMETHEUS}"
            model:
              expr: "max by (topic) (confluent_kafka_server_cluster_link_mirror_topic_offset_lag{kafka_id=\"$CLUSTER_ID\"} / on(topic) rate(confluent_kafka_server_received_records{kafka_id=\"$CLUSTER_ID\"}[5m]))"
              refId: A
          - refId: B
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [14400]
              refId: C
        for: 15m
        labels:
          team: fsi-kafka
          sla_tier: best-effort
          severity: critical
        annotations:
          summary: "Mirror lag exceeds 4h for best-effort-tier topic -- potential data loss risk"
          description: "Mirror lag exceeds alert threshold for best-effort tier (14400s). Potential data loss risk. Evaluate failover readiness. Topic: {{ $labels.topic }}, Current lag: {{ $value }}s"

      # -- Compliance tier: warn=10s, alert=30s --
      - uid: fsi-mirror-lag-compliance-warn
        title: MirrorLagCompliance - Warning
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "${DS_PROMETHEUS}"
            model:
              expr: "max by (topic) (confluent_kafka_server_cluster_link_mirror_topic_offset_lag{kafka_id=\"$CLUSTER_ID\"} / on(topic) rate(confluent_kafka_server_received_records{kafka_id=\"$CLUSTER_ID\"}[5m]))"
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
              refId: C
        for: 1m
        labels:
          team: fsi-kafka
          sla_tier: compliance
          severity: warning
