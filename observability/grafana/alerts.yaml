            model:
              expr: "max by (topic) (confluent_kafka_server_cluster_link_mirror_topic_offset_lag{kafka_id=\"$CLUSTER_ID\"} / on(topic) rate(confluent_kafka_server_received_records{kafka_id=\"$CLUSTER_ID\"}[5m]))"
