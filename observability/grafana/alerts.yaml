              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [900]
              refId: C
        for: 5m
        labels:
          team: fsi-kafka
          sla_tier: standard
          severity: critical
        annotations:
          summary: "Mirror lag exceeds 15m for standard-tier topic -- potential data loss risk"
          description: "Mirror lag exceeds alert threshold for standard tier (900s). Potential data loss risk. Evaluate failover readiness. Topic: {{ $labels.topic }}, Current lag: {{ $value }}s"

      # -- Best-effort tier: warn=3600s (1h), alert=14400s (4h) --
      - uid: fsi-mirror-lag-besteffort-warn
        title: MirrorLagBestEffort - Warning
        condition: C
