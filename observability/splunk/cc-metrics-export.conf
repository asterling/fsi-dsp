# =============================================================================
# Confluent Cloud Metrics API -- Splunk Scripted Input Configuration
# =============================================================================
# Ingest CC metrics into Splunk via scripted input.
# Place this file in $SPLUNK_HOME/etc/apps/fsi_kafka/local/inputs.conf
# or deploy via Splunk deployment server.
#
# The collector script (cc_metrics_collector.py) polls the CC Metrics API
# Prometheus export endpoint and outputs events in Splunk-compatible format.
#
# Endpoint: https://api.telemetry.confluent.cloud/v2/metrics/cloud/export
# Authentication: Basic auth with CC API key/secret
#
# See https://docs.confluent.io/cloud/current/monitoring/metrics-api.html
# for CC Metrics API reference.
# =============================================================================

[script://./bin/cc_metrics_collector.py]
disabled = false
interval = 60
index = kafka
sourcetype = confluent_cloud:metrics
# Configuration:
# CC_METRICS_API_KEY = {{CC_METRICS_API_KEY}}
# CC_METRICS_API_SECRET = {{CC_METRICS_API_SECRET}}
# CC_METRICS_ENDPOINT = https://api.telemetry.confluent.cloud/v2/metrics/cloud/export
# CLUSTER_ID = {{CLUSTER_ID}}
