# =============================================================================
# JMX Data Collection -- Splunk JMX Add-on Configuration Stub
# =============================================================================
# Wired in Phase 8 (CFK) and Phase 9 (CP).
# Place this file in $SPLUNK_HOME/etc/apps/fsi_kafka/local/inputs.conf
# alongside the cc-metrics-export.conf stanza.
#
# Requires the Splunk Add-on for JMX (Splunkbase) or a custom scripted input
# that polls JMX MBeans and outputs metrics in Splunk-compatible format.
#
# Port 9101 matches reference/local-dev/docker-compose.yml KAFKA_JMX_PORT.
# =============================================================================

[kafka_jmx]
disabled = true
interval = 30
index = kafka
sourcetype = kafka:jmx
jmx_host = {{JMX_EXPORTER_HOST}}
jmx_port = 9101
object_names = kafka.server:type=ReplicaManager,name=UnderReplicatedPartitions;kafka.server:type=BrokerTopicMetrics,name=MessagesInPerSec;kafka.controller:type=KafkaController,name=ActiveControllerCount;kafka.server:type=ReplicaManager,name=PartitionCount
