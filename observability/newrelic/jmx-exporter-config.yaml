# =============================================================================
# FSI Kafka Platform -- New Relic JMX Integration
# =============================================================================
# Reference configuration for JMX metric collection in CFK/CP deployments.
# Uses the nri-jmx infrastructure integration to collect Kafka broker MBeans.
#
# Uses the nri-jmx infrastructure integration to collect Kafka broker MBeans.
# Requires the New Relic Infrastructure agent on the target host.
# =============================================================================

integrations:
  - name: nri-jmx
    env:
      JMX_HOST: "{{JMX_EXPORTER_HOST}}"
      JMX_PORT: 9101
      COLLECTION_FILES: /etc/newrelic-infra/integrations.d/kafka-jmx.yml
    labels:
      role: kafka-broker
      environment: "{{ENVIRONMENT}}"

# ---------------------------------------------------------------------------
