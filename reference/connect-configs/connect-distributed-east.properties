# =============================================================================
# FSI Kafka Connect Distributed — East (Production)
# =============================================================================
# This file is used when Connect workers are bootstrapped to the East cluster.
# During DR failover, switch to connect-distributed-west.properties.
# =============================================================================

# ── Cluster connection (Consul DNS resolves to East CC) ──
bootstrap.servers=kafka.fsi.internal:9092
security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required \
  username='${KAFKA_API_KEY}' \
  password='${KAFKA_API_SECRET}';

# ── Worker identity ──
group.id=fsi-connect-cluster
offset.storage.topic=connect-offsets
config.storage.topic=connect-configs
status.storage.topic=connect-status

offset.storage.replication.factor=3
config.storage.replication.factor=3
status.storage.replication.factor=3

# ── Converters (Avro with Schema Registry) ──
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=https://schema.fsi.internal
value.converter.basic.auth.credentials.source=USER_INFO
value.converter.basic.auth.user.info=${SR_API_KEY}:${SR_API_SECRET}

# ── Consumer/Producer overrides for CC ──
consumer.security.protocol=SASL_SSL
consumer.sasl.mechanism=PLAIN
consumer.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required \
  username='${KAFKA_API_KEY}' \
  password='${KAFKA_API_SECRET}';

producer.security.protocol=SASL_SSL
producer.sasl.mechanism=PLAIN
producer.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required \
  username='${KAFKA_API_KEY}' \
  password='${KAFKA_API_SECRET}';

# ── REST API ──
rest.port=8083
rest.advertised.host.name=localhost

# ── Plugin path ──
plugin.path=/opt/kafka-connect/plugins
