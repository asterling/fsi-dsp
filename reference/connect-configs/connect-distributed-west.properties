# =============================================================================
# FSI Kafka Connect Distributed — West (DR)
# =============================================================================
# Identical to East except bootstrap resolves to West CC cluster.
# With Consul DNS, this file may not be needed — kafka.fsi.internal
# automatically resolves to the active cluster after a Consul KV flip.
#
# This file exists as a manual fallback if Consul DNS is not in use.
# =============================================================================

bootstrap.servers=pkc-yyyyy.us-west-2.aws.confluent.cloud:9092
security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required \
  username='${DR_KAFKA_API_KEY}' \
  password='${DR_KAFKA_API_SECRET}';

group.id=fsi-connect-cluster
offset.storage.topic=connect-offsets
config.storage.topic=connect-configs
status.storage.topic=connect-status

offset.storage.replication.factor=3
config.storage.replication.factor=3
status.storage.replication.factor=3

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=https://psrc-yyyyy.us-west-2.aws.confluent.cloud
value.converter.basic.auth.credentials.source=USER_INFO
value.converter.basic.auth.user.info=${DR_SR_API_KEY}:${DR_SR_API_SECRET}

consumer.security.protocol=SASL_SSL
consumer.sasl.mechanism=PLAIN
consumer.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required \
  username='${DR_KAFKA_API_KEY}' \
  password='${DR_KAFKA_API_SECRET}';

producer.security.protocol=SASL_SSL
producer.sasl.mechanism=PLAIN
producer.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required \
  username='${DR_KAFKA_API_KEY}' \
  password='${DR_KAFKA_API_SECRET}';

rest.port=8083
rest.advertised.host.name=localhost
plugin.path=/opt/kafka-connect/plugins
