# =============================================================================
# FSI Kafka Platform — CI Pipeline
# Lint → Validate → Plan → Review Gate
# =============================================================================
name: Terraform Plan

on:
  pull_request:
    paths:
      - 'environments/**'
      - 'modules/**'
      - 'schemas/**'
      - 'ci/**'

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.0"
  TF_WORKING_DIR: "environments/prod-east"

jobs:
  # ── Step 1: Lint ──
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Validate Topic Naming Convention
        run: |
          echo "Checking topic naming convention in Terraform files..."
          for dir in environments/*/  scenarios/*/; do
            if [ -d "$dir" ]; then
              grep -h 'domain\s*=' "$dir"*.tf 2>/dev/null \
                | sed 's/.*=\s*"\(.*\)"/\1/' \
                | while read -r domain; do
                    if ! echo "$domain" | grep -qP '^[a-z][a-z0-9-]{1,30}$'; then
                      echo "ERROR: Invalid domain name: $domain (in $dir)"
                      exit 1
                    fi
                  done
            fi
          done
          echo "Naming convention check passed"

      - name: Validate Avro Schemas
        run: python3 ci/scripts/validate-schemas.py --schemas-dir schemas/

      - name: Check Schema Compatibility (SR)
        if: github.event_name == 'pull_request'
        env:
          SR_ENDPOINT: ${{ secrets.CC_SR_REST_ENDPOINT }}
          SR_API_KEY: ${{ secrets.SR_API_KEY }}
          SR_API_SECRET: ${{ secrets.SR_API_SECRET }}
        run: python3 ci/scripts/validate-schemas.py --schemas-dir schemas/ --check-compatibility
        continue-on-error: true

      - name: Check Compatibility Overrides
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash ci/scripts/check-overrides.sh

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

  # ── Step 2: Plan ──
  plan:
    name: Terraform Plan
    needs: lint
    runs-on: ubuntu-latest
    environment: fsi-prod-east
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan-output.txt
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_confluent_cloud_api_key: ${{ secrets.CONFLUENT_CLOUD_API_KEY }}
          TF_VAR_confluent_cloud_api_secret: ${{ secrets.CONFLUENT_CLOUD_API_SECRET }}
          TF_VAR_kafka_api_key: ${{ secrets.KAFKA_API_KEY }}
          TF_VAR_kafka_api_secret: ${{ secrets.KAFKA_API_SECRET }}
          TF_VAR_sr_api_key: ${{ secrets.SR_API_KEY }}
          TF_VAR_sr_api_secret: ${{ secrets.SR_API_SECRET }}
          TF_VAR_dr_kafka_api_key: ${{ secrets.DR_KAFKA_API_KEY }}
          TF_VAR_dr_kafka_api_secret: ${{ secrets.DR_KAFKA_API_SECRET }}

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/prod-east/plan-output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n... (truncated)'
              : plan;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform Plan\n\`\`\`\n${truncated}\n\`\`\`\n\n**Review required before merge.**`
            });

  # ── Step 3: Apply (manual, after merge) ──
  # Apply is triggered by merge to main, not in this workflow.
  # See terraform-apply.yml for the apply pipeline.
