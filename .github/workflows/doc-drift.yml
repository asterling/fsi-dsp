name: Doc Drift

on:
  pull_request:
    paths:
      - 'MANIFEST.yaml'
      - 'README.md'
      - 'EXECSUMMARY.md'
      - 'scenarios/**'
      - 'ansible/roles/**'
      - 'ansible/site.yml'
      - 'modules/**'
      - 'docs/adr/**'
      - 'accelerators/**'
      - 'ci/scripts/check-doc-drift.py'
      - '.github/workflows/doc-drift.yml'
  push:
    branches: [main]

jobs:
  check-doc-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      # Enforce mode: doc-claim/path/stray drift fails CI. Fix count/table
      # drift locally with:
      #   python ci/scripts/check-doc-drift.py --fix
      # --allow-strays is TEMPORARY: it keeps the known unregistered strays
      # (1 ADR + 2 accelerator layers) warning-only so enforcement can land
      # now. Remove --allow-strays once the stray-registration PR registers
      # them, so strays block unconditionally.
      - name: Check MANIFEST/disk/doc parity
        run: python ci/scripts/check-doc-drift.py --enforce --allow-strays
