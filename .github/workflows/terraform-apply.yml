# =============================================================================
# FSI Kafka Platform — Apply on Merge
# Only runs when PRs are merged to main
# =============================================================================
name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'
      - 'schemas/**'

permissions:
  contents: read

env:
  TF_VERSION: "1.7.0"
  TF_WORKING_DIR: "environments/prod-east"

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: fsi-prod-east-apply  # Requires environment protection rules
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_confluent_cloud_api_key: ${{ secrets.CONFLUENT_CLOUD_API_KEY }}
          TF_VAR_confluent_cloud_api_secret: ${{ secrets.CONFLUENT_CLOUD_API_SECRET }}
          TF_VAR_kafka_api_key: ${{ secrets.KAFKA_API_KEY }}
          TF_VAR_kafka_api_secret: ${{ secrets.KAFKA_API_SECRET }}
          TF_VAR_sr_api_key: ${{ secrets.SR_API_KEY }}
          TF_VAR_sr_api_secret: ${{ secrets.SR_API_SECRET }}
          TF_VAR_dr_kafka_api_key: ${{ secrets.DR_KAFKA_API_KEY }}
          TF_VAR_dr_kafka_api_secret: ${{ secrets.DR_KAFKA_API_SECRET }}
